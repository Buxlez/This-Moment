<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#060b12">
  <meta name="description" content="this moment，根据此刻环境和自然语言生成音乐推荐。">
  <title>this moment · 此刻的音乐</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230a1722'/%3E%3Cpath d='M10 20V12m4 11V9m4 12V11m4 7v-4' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <canvas class="scene-canvas" id="sceneCanvas" aria-hidden="true"></canvas>

  <main class="glass-panel" id="glassPanel">
    <header class="panel-header" id="top">
      <h1 class="panel-title" id="pageTitle">THIS MOMENT</h1>
      <p class="panel-status">
        <span class="mode-pill" id="modePill" title="正在连接"><span class="status-dot"></span><span class="sr-only">正在连接</span></span>
        <span class="scene-env" id="sceneEnv" aria-live="polite">深圳 · 下雨 · 21:00</span>
      </p>
    </header>

    <section class="conversation-feed" id="conversationFeed" aria-label="音乐推荐对话" tabindex="-1">
      <div class="empty-state" id="emptyState">
        <!-- 空状态文案集中在这里维护（改版文档 3.1 节） -->
        <div class="empty-copy">
          <p>从一句模糊的想法开始</p>
          <span>窗外的天气和时间只作参考，你说的那句话才算数。</span>
        </div>
        <div class="prompt-chips" aria-label="示例输入">
          <button type="button" data-prompt="上班路上有点困，想提神但别太吵">提神，但别太吵</button>
          <button type="button" data-prompt="坐车回家有点累，想听舒服但别太伤感的歌">舒服，但别伤感</button>
          <button type="button" data-prompt="来点音乐">就按此刻来</button>
        </div>
      </div>

      <div class="cards" id="cards"></div>

      <section class="progress-panel" id="progressPanel" hidden aria-live="polite" aria-labelledby="progressTitle">
        <div class="pending-user-wrap">
          <p class="message-user" id="pendingUserMessage"></p>
          <span class="message-meta" id="pendingMessageMeta"></span>
        </div>
        <div class="progress-card">
          <div class="progress-icon" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="progress-body">
            <div class="progress-line"><strong id="progressTitle">理解这一刻</strong><span><b id="progressNumber">18</b>%</span></div>
            <div class="progress-track" aria-hidden="true"><i id="progressBar"></i></div>
            <ol class="progress-steps" aria-label="推荐生成进度">
              <li data-stage="understanding" class="active">理解</li>
              <li data-stage="candidates">候选</li>
              <li data-stage="validating">核对</li>
              <li data-stage="composing">整理</li>
            </ol>
          </div>
        </div>
      </section>
    </section>

    <div class="composer-dock" id="composerDock">
      <form class="composer" id="recommendationForm">
        <label class="sr-only" for="momentInput">描述你此刻想听的音乐</label>
        <textarea id="momentInput" maxlength="500" rows="1" placeholder="说说此刻的感受和想听的风格吧" required></textarea>
        <button class="send-button" id="sendButton" type="submit" aria-label="生成音乐推荐">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5M5.5 9.5 10 5l4.5 4.5"/></svg>
        </button>
      </form>

      <aside class="player-shell is-empty" id="playerShell" aria-label="全局播放器">
        <div class="player-track">
          <div class="player-cover" id="playerCover" aria-hidden="true"><span>tm</span></div>
          <div class="player-track-copy">
            <strong id="playerTitle">还没有播放音乐</strong>
            <span id="playerArtist">从一张卡片开始</span>
          </div>
          <div class="player-controls">
            <button id="previousButton" type="button" aria-label="上一首"><svg viewBox="0 0 20 20"><path d="M5 4v12M15 5l-7 5 7 5z"/></svg></button>
            <button class="player-play" id="playButton" type="button" aria-label="播放">
              <svg class="icon-play" viewBox="0 0 20 20"><path d="m7 5 8 5-8 5z"/></svg>
              <svg class="icon-pause" viewBox="0 0 20 20"><path d="M6 5h3v10H6zM11 5h3v10h-3z"/></svg>
            </button>
            <button id="nextButton" type="button" aria-label="下一首"><svg viewBox="0 0 20 20"><path d="M15 4v12M5 5l7 5-7 5z"/></svg></button>
          </div>
        </div>
        <div class="player-timeline">
          <span id="currentTime">0:00</span>
          <input id="seekInput" type="range" min="0" max="100" value="0" aria-label="播放进度">
          <span id="durationTime">0:00</span>
        </div>
        <div class="player-side">
          <span id="queuePosition">0 / 0</span>
          <button id="muteButton" type="button" aria-label="静音"><svg viewBox="0 0 20 20"><path d="M3 8h3l4-3v10l-4-3H3zM13 7c1 1 1 5 0 6M15 5c3 3 3 7 0 10"/></svg></button>
        </div>
        <audio id="audio" preload="metadata"></audio>
      </aside>

      <div class="dock-meta">
        <span>内容由 AI 生成，歌曲播放以音源状态为准</span>
      </div>
    </div>
  </main>

  <nav class="side-rail" id="sideRail" aria-label="场景与视图">
    <button class="rail-button" id="scrollTopButton" type="button" aria-label="回到对话顶部" title="回到对话顶部">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h11v-9"/></svg>
    </button>
    <button class="rail-button" id="sceneButton" type="button" aria-label="选择场景" title="选择场景" aria-haspopup="dialog" aria-expanded="false" aria-controls="scenePanel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.5"/></svg>
    </button>
    <button class="rail-button" id="randomSceneButton" type="button" aria-label="随机切换场景" title="随机切换场景">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5"/><circle class="pip" cx="9" cy="9" r="1"/><circle class="pip" cx="15" cy="9" r="1"/><circle class="pip" cx="12" cy="12" r="1"/><circle class="pip" cx="9" cy="15" r="1"/><circle class="pip" cx="15" cy="15" r="1"/></svg>
    </button>
    <button class="rail-button" id="immersiveButton" type="button" aria-label="沉浸模式" title="沉浸模式" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path class="fill" d="M12 4.5a7.5 7.5 0 0 0 0 15z"/></svg>
    </button>
  </nav>

  <div class="scene-backdrop" id="sceneBackdrop" hidden></div>
  <section class="scene-popover" id="scenePanel" role="dialog" aria-label="选择场景" hidden>
    <div class="scene-popover-heading">
      <strong>换一扇车窗</strong>
      <span>场景只改变参考的天气和时间</span>
    </div>
    <div class="scene-grid" id="sceneGrid"></div>
    <div class="scene-real">
      <button class="scene-real-button" id="realWeatherButton" type="button">用此刻真实天气</button>
      <span class="scene-real-status" id="environmentSource" aria-live="polite">定位只用于即时查询，不会写入推荐记录</span>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/player.js"></script>
  <script src="/narration.js"></script>
  <script src="/app-model.js"></script>
  <script src="/scenes.js"></script>
  <script src="/scene-renderer.js"></script>
  <script src="/app.js"></script>
</body>
</html>
